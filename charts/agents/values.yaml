nameOverride: ""
fullnameOverride: ""

# This Secret must already exist in the release namespace. No secrets are generated.
existingSecret: agents-credentials
secretKeys:
  adminToken: admin.token
  internalToken: internal.token
  databaseDSN: database-dsn

public:
  serverURL: https://agents.example.com
  edgeURL: https://connect.agents.example.com/agent

image:
  # Empty means Chart.appVersion. Releases publish multi-arch amd64/arm64 images.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

control:
  replicaCount: 1
  image:
    repository: ghcr.io/bit-precise/agents-control
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  podAnnotations: {}

edge:
  # Connection ownership is single-Edge. Scaling this deployment is unsupported.
  replicaCount: 1
  image:
    repository: ghcr.io/bit-precise/agents-edge
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  podAnnotations: {}

console:
  replicaCount: 1
  image:
    repository: ghcr.io/bit-precise/agents-console
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}
  podAnnotations: {}

database:
  type: sqlite

# Only control mounts this volume. PostgreSQL deployments use no PVC.
persistence:
  enabled: true
  retain: true
  existingClaim: ""
  size: 1Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]

oidc:
  enabled: false
  issuer: ""
  clientId: ""
  # Optional confidential-client secret. Empty key selects public-client PKCE.
  existingSecret: ""
  clientSecretKey: ""
  scopes: [openid, profile, email]
  # Exact subjects at the configured issuer; applied only on first account creation.
  bootstrapAdminSubjects: []
  # Exact, case-insensitive emails from verified ID-token claims (email_verified: true).
  # Fresh login grants admin; removal revokes email-derived admin on Control restart.
  adminEmails: []

# Ory Hydra is this instance's own OAuth authorization server for `agentd
# login` (RFC 8628 Device Flow). It is separate from the upstream oidc IdP and
# requires oidc.enabled: a device is registered by a person signed in with SSO.
hydra:
  enabled: false
  image:
    repository: docker.io/oryd/hydra
    # The Device Flow integration is tested against this release; the digest
    # pins its multi-architecture manifest list. Change both together.
    tag: v26.2.0
    digest: "sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9"
  # Issuer origin reached by agentd and browsers, e.g. https://auth.agents.example.com
  # or the serverURL origin itself. Only discovery, device authorization,
  # verification and token paths are routed; the Admin API never is.
  publicURL: ""
  database:
    # postgres: a database and account separate from agents' own.
    # memory: evaluation only; restarts lose pending registrations.
    type: postgres
  # Defaults to the root existingSecret. Keys hold Hydra's DSN and its
  # comma-separated system secrets (the first signs, the rest still verify).
  existingSecret: ""
  secretKeys:
    dsn: hydra-dsn
    systemSecrets: hydra-system-secrets
  # Public client used by agentd and the only accepted token audience.
  # Empty audience means urn:agents:<serverURL host>:agent-enrollment.
  clientId: agentd
  audience: ""
  replicaCount: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: "1", memory: 256Mi}
  podAnnotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

terminationGracePeriodSeconds: 30
tmpSizeLimit: 64Mi
nodeSelector:
  kubernetes.io/os: linux
tolerations: []
affinity: {}

probes:
  enabled: true
  # /healthz reports process health, not end-to-end provider or database readiness.
  startup:
    httpGet: {path: /healthz, port: http}
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 30
  readiness:
    httpGet: {path: /healthz, port: http}
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    httpGet: {path: /healthz, port: http}
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

ingress:
  enabled: true
  className: ""
  annotations: {}
  # One wildcard per workspace, e.g. *.workspace1.agents.example.com.
  # Exact names like demo.workspace1.agents.example.com are also accepted.
  serviceHosts: []
  # Existing TLS Secrets; no certificates or certificate requests are created.
  # Empty relies on the ingress controller's configured default certificate.
  tls: []

networkPolicy:
  enabled: false
  # Adjust for the actual ingress controller before enabling policy enforcement.
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  dnsPeers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  postgresEgress:
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
        - ipBlock: {cidr: "::/0"}
      ports: [{protocol: TCP, port: 5432}]
  oidcEgress:
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
        - ipBlock: {cidr: "::/0"}
      ports: [{protocol: TCP, port: 443}]
  # Hydra and its migration Job reach their own PostgreSQL.
  hydraPostgresEgress:
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
        - ipBlock: {cidr: "::/0"}
      ports: [{protocol: TCP, port: 5432}]
  extraEgress:
    control: []
    edge: []
    console: []
    hydra: []
