{{- if .Values.ingress.enabled }}
{{- $root := . }}
{{- $name := include "agents.fullname" . }}
{{- $controlHost := (urlParse .Values.public.serverURL).hostname }}
{{- $edgeHost := (urlParse .Values.public.edgeURL).hostname }}
{{- $hydraHost := "" }}
{{- if .Values.hydra.enabled }}
{{- $hydraHost = (urlParse .Values.hydra.publicURL).hostname }}
{{- end }}
{{- /* Only the issuer paths agentd and browsers use; never Hydra's Admin API. */}}
{{- $hydraPaths := list "/.well-known/openid-configuration" "/oauth2/device/auth" "/oauth2/device/verify" "/oauth2/token" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agents.labels" (dict "root" . "component" "edge") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $controlHost | quote }}
      http:
        paths:
          {{- if eq $controlHost $hydraHost }}
          {{- range $hydraPaths }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ $name }}-hydra-public
                port: {name: public}
          {{- end }}
          {{- end }}
          {{- if eq $controlHost $edgeHost }}
          - path: /agent
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-edge
                port: {name: http}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-control
                port: {name: http}
    {{- if and $hydraHost (ne $hydraHost $controlHost) }}
    - host: {{ $hydraHost | quote }}
      http:
        paths:
          {{- range $hydraPaths }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ $name }}-hydra-public
                port: {name: public}
          {{- end }}
    {{- end }}
    {{- if ne $controlHost $edgeHost }}
    - host: {{ $edgeHost | quote }}
      http:
        paths:
          - path: /agent
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-edge
                port: {name: http}
    {{- end }}
    {{- range .Values.ingress.serviceHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-edge
                port: {name: http}
    {{- end }}
{{- end }}
