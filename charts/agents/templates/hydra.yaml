{{- if .Values.hydra.enabled }}
{{- $name := include "agents.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-hydra-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agents.labels" (dict "root" . "component" "hydra") | nindent 4 }}
data:
  hydra.yaml: |
    {{- include "agents.hydraConfiguration" . | nindent 4 }}
{{- range $port := list (dict "name" "public" "number" 4444) (dict "name" "admin" "number" 4445) }}
---
# {{ ternary "Routed by the Ingress for issuer paths only." "Cluster-internal; only Control may reach it." (eq $port.name "public") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-hydra-{{ $port.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "agents.labels" (dict "root" $ "component" "hydra") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: {{ $port.name }}
      port: {{ $port.number }}
      targetPort: {{ $port.name }}
      protocol: TCP
  selector:
    {{- include "agents.selectorLabels" (dict "root" $ "component" "hydra") | nindent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-hydra
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agents.labels" (dict "root" . "component" "hydra") | nindent 4 }}
spec:
  replicas: {{ ternary 1 .Values.hydra.replicaCount (eq .Values.hydra.database.type "memory") }}
  selector:
    matchLabels:
      {{- include "agents.selectorLabels" (dict "root" . "component" "hydra") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agents.selectorLabels" (dict "root" . "component" "hydra") | nindent 8 }}
      annotations:
        checksum/config: {{ include "agents.hydraConfiguration" . | sha256sum }}
        {{- with .Values.hydra.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      os:
        name: linux
      serviceAccountName: {{ include "agents.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hydra
          image: {{ include "agents.hydraImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "all", "--config", "/etc/hydra/hydra.yaml"]
          env:
            {{- include "agents.hydraEnvironment" . | nindent 12 }}
          ports:
            - name: public
              containerPort: 4444
              protocol: TCP
            - name: admin
              containerPort: 4445
              protocol: TCP
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.hydra.resources | nindent 12 }}
          {{- if .Values.probes.enabled }}
          startupProbe:
            httpGet: {path: /health/ready, port: admin}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: admin}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/alive, port: admin}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          {{- end }}
          volumeMounts:
            - name: configuration
              mountPath: /etc/hydra/hydra.yaml
              subPath: hydra.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: configuration
          configMap:
            name: {{ $name }}-hydra-config
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit | quote }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if eq .Values.hydra.database.type "postgres" }}
---
# Hydra's schema follows its release: migrate before every install or upgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-hydra-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agents.labels" (dict "root" . "component" "hydra-migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "agents.selectorLabels" (dict "root" . "component" "hydra-migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "agents.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "agents.hydraImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate", "sql", "up", "-e", "--yes"]
          env:
            {{- include "agents.hydraEnvironment" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.hydra.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit | quote }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
