# 生产配置示例；用 agents init 生成私有状态目录和 admin.token。
# 所有文件路径相对于此配置文件。不要提交真实凭据、数据库密码或私钥。
serverURL: https://agents.example.com
edgeURL: https://connect.agents.example.com/agent
listenAddress: 0.0.0.0:8443
# 本例假定公开 443 入口以 HTTPS 回源到 8443；直接暴露 8443 时，两个 URL 也加 :8443。
stateDir: ./state/agents
adminTokenFile: ./state/agents/admin.token
database:
  type: sqlite
  dsn: ./state/agents/agents.db
tls:
  certFile: ./certs/server.crt
  keyFile: ./certs/server.key
developmentHTTP: false

# 可选 OIDC；adminEmails 仅匹配 ID token 中 email_verified: true 的完整邮箱。
# 名单新增需重新登录；移除后重启撤销邮箱派生的管理员权限（保留 bootstrap 来源）。
# oidc:
#   enabled: true
#   issuer: https://id.example.com
#   clientId: agents
#   clientSecretFile: ./secrets/oidc-client-secret
#   scopes: [openid, profile, email]
#   bootstrapAdminSubjects: []
#   adminEmails: [operator@example.com]

# 可选 Hydra，为 `agentd login` 提供 Device Flow；需要同时启用 oidc。
# publicURL 是 agentd 和浏览器访问的 issuer；adminURL 只允许 Control 访问。
# hydra:
#   enabled: true
#   publicURL: https://auth.agents.example.com
#   adminURL: http://127.0.0.1:4445
#   clientId: agentd
#   # 缺省为 urn:agents:<serverURL 主机名>:agent-enrollment
#   audience: ""

# PostgreSQL 可替换上述 database；不是多控制节点开关：
# database:
#   type: postgres
#   dsn: postgres://agents@127.0.0.1:5432/agents?sslmode=require
# YAML 不做环境变量插值，认证配置必须保存在受保护位置。
